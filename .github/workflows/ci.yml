name: CI

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    working-directory: apoptoside

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: apoptoside
      # pixi.toml installs caspase_model from a sibling checkout
      - uses: actions/checkout@v7
        with:
          repository: acorbat/caspase_model
          path: caspase_model
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          manifest-path: apoptoside/pixi.toml
      - run: pixi run lint
      - run: pixi run test
