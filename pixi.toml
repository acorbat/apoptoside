[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]

[package.build]
backend = { name = "pixi-build-python", version = "*" }
config = { ignore-pypi-mapping = false }  # Enable automatic PyPI-to-conda mapping

[environments]
default = ["py312", "test", "lint"]

[dependencies]
apoptoside = { path = "." }
ipykernel = "*"

[pypi-dependencies]
# Sibling checkout, see README.md
caspase-model = { path = "../caspase_model", editable = true, extras = ["simbio"] }

[feature]
py312.dependencies = { python = "3.12.*" }

[feature.lint]
dependencies = { prek = "*", tombi = "*", ruff = "*", mdformat = "*" }
tasks = { lint = "prek run --all-files" }

[feature.test]
dependencies = { pytest = "*" }
tasks = { test = "pytest" }
